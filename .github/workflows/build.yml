# Build artifacts for all platforms:
#   Linux   x86_64 / aarch64 — tar.gz (binary, .desktop, icons, install.sh)
#   Windows x86_64 / aarch64 — NSIS installer setup.exe (also used by the
#                              in-app updater, see src/update.rs)
# Runs on v* tags and manual dispatch only; a tag additionally creates a GitHub Release.
# The tag must match the version in Cargo.toml (vX.Y.Z), otherwise the release fails.

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev

      - name: Install Rust
        shell: bash
        run: |
          # windows-11-arm images ship without rustup.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin cratty

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          pkg="cratty-${version}-${{ matrix.arch }}-linux"
          mkdir -p "$pkg"
          cp target/release/cratty LICENSE "$pkg/"
          cp cratty-brand/icons/cratty-icon-1024.png "$pkg/cratty.png"
          cp cratty-brand/icons/cratty-icon.svg "$pkg/cratty.svg"

          cat > "$pkg/cratty.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Cratty
          Comment=SSH client
          Exec=cratty
          Icon=cratty
          Terminal=false
          StartupWMClass=cratty
          Categories=Network;RemoteAccess;System;TerminalEmulator;
          Keywords=ssh;sftp;terminal;
          EOF

          cat > "$pkg/install.sh" <<'EOF'
          #!/bin/sh
          # Installs Cratty for the current user (~/.local).
          set -e
          cd "$(dirname "$0")"
          install -Dm755 cratty "$HOME/.local/bin/cratty"
          install -Dm644 cratty.png "$HOME/.local/share/icons/hicolor/1024x1024/apps/cratty.png"
          install -Dm644 cratty.svg "$HOME/.local/share/icons/hicolor/scalable/apps/cratty.svg"
          install -Dm644 cratty.desktop "$HOME/.local/share/applications/cratty.desktop"
          echo "Cratty installed: ~/.local/bin/cratty"
          EOF
          chmod +x "$pkg/install.sh"

          tar -czf "${pkg}.tar.gz" "$pkg"

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $makensis = @(
            (Get-Command makensis -ErrorAction SilentlyContinue).Source,
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis `
            "-DVERSION=$version" `
            "-DARCH=${{ matrix.arch }}" `
            "-DOUTFILE=$(Join-Path $PWD "cratty-$version-${{ matrix.arch }}-setup.exe")" `
            "-DBINDIR=$(Join-Path $PWD 'target/release')" `
            "-DICON=$(Join-Path $PWD 'assets/cratty.ico')" `
            "-DLICENSEFILE=$(Join-Path $PWD 'LICENSE')" `
            dist/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cratty-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            cratty-*-linux.tar.gz
            cratty-*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gh release create --verify-tag needs the tag in a local git repo
          fetch-depth: 0

      - name: Check tag matches Cargo.toml version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [[ "${{ github.ref_name }}" != "v${version}" ]]; then
            echo "::error::Tag ${{ github.ref_name }} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)"
          git log ${prev:+"$prev.."}"${{ github.ref_name }}" --no-merges --pretty='- %s' | grep -v '^- Bump version' > notes.md || true
          gh release create "${{ github.ref_name }}" \
            --title "Cratty ${{ github.ref_name }}" \
            --notes-file notes.md --verify-tag \
            release/*
