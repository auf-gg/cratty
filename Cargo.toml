[workspace]
members = [".", "crates/agent", "crates/proto", "crates/sync", "crates/vault"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT"

[package]
name = "cratty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native SSH client with GPU rendering"

[dependencies]
agent = { path = "crates/agent" }
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.34"
# `syntect` — syntax highlighting in the file editor: ~200 languages for a few
# megabytes (tree-sitter would cost tens), colors come from the theme.
gpui-kit = { version = "0.9", default-features = false, features = ["component", "assets", "syntect"] }
# Operating system secret store: Keychain on macOS, Credential
# Manager on Windows, Secret Service on other unix. The `v1` feature (also
# the default) picks the right implementation for the target platform, and the extra
# backends are not built — `keyring` declares them per target.
keyring = "4.2"
proto = { path = "crates/proto" }
# `aws-lc-rs` (enabled in russh by default) requires NASM on Windows — an unnecessary
# system dependency for nothing. `ring` already comes with gpui via rustls,
# so we use it as the crypto backend.
russh = { version = "0.63.1", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-config = "0.58.0"
# Interface translations (same crate and version as gpui-component, so its
# widgets follow our locale) and detection of the system language.
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
# Random bytes for new SSH keys (same version as proto and vault).
getrandom = { version = "0.4.3", default-features = false }
# SFTP over a russh channel: works with any stream, including behind a proxy.
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sync = { path = "crates/sync" }
# `io-std` — standard input and output of `cratty --mcp-bridge`.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "io-util", "io-std", "sync", "time", "fs"] }
# SOCKS5 link of the proxy chain. Already comes in transitively via reqwest.
tokio-socks = "0.5.3"
# HTTP for the selfh.st icon catalog: a simple blocking client on rustls
# with ring (already present) and built-in root certificates.
ureq = "3.5"
# Downscaling PNG icons to their on-screen size (already comes with gpui).
image = { version = "0.25", default-features = false, features = ["png"] }
# Unpacking the bundled Font Awesome icons (already comes with russh).
flate2 = "1"
unicode-width = "0.2"
vault = { path = "crates/vault" }
zeroize = "1.9.0"

# Both already come in transitively via gpui-kit; here they are needed directly — for
# `mlock`/`VirtualLock` and disabling dumps in `src/platform.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ErrorReporting",
    "Win32_System_Diagnostics_Debug",
    # QueryUnbiasedInterruptTime — time excluding sleep, for auto-lock.
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    # AllowSetForegroundWindow — a second copy lets the first one bring its window forward.
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
# Dependencies (gpui-kit, blade, shaping) are built with optimizations: we debug our own code,
# not others', and responsiveness matters even in debug builds.
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
# A generator with the rand_core interface — for the encrypted key test.
getrandom = { version = "0.4.3", default-features = false, features = ["sys_rng"] }
alacritty_terminal = "0.26.0"
gpui-kit = { version = "0.9", default-features = false, features = ["component", "assets", "syntect", "test-support"] }
rand = { version = "0.10.2", features = ["thread_rng"] }
# `process` — the test sshd runs exec requests with the local `sh`.
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net", "sync", "test-util", "process"] }
