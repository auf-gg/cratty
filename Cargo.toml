[workspace]
members = [".", "crates/agent", "crates/proto", "crates/sync", "crates/vault"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"

[package]
name = "cratty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Нативный SSH-клиент с GPU-рендерингом"

[dependencies]
agent = { path = "crates/agent" }
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.34"
gpui.workspace = true
gpui-component = "0.5.1"
# Хранилище секретов операционной системы: Keychain на macOS, Credential
# Manager на Windows, Secret Service на остальных unix. Фича `v1` (она же
# default) сама выбирает нужную реализацию под целевую платформу, и лишние
# бэкенды при этом не собираются — они объявлены у `keyring` по-таргетно.
keyring = "4.2"
proto = { path = "crates/proto" }
# `aws-lc-rs` (включён у russh по умолчанию) требует NASM на Windows — лишняя
# системная зависимость на ровном месте. `ring` уже приходит с gpui через rustls,
# так что криптобэкенд берём его.
russh = { version = "0.63.1", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-config = "0.58.0"
# SFTP поверх канала russh: работает с любым потоком, в том числе за прокси.
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sync = { path = "crates/sync" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
# SOCKS5-звено цепочки прокси. Уже приходит транзитивно через reqwest.
tokio-socks = "0.5.3"
unicode-width = "0.2"
vault = { path = "crates/vault" }
zeroize = "1.9.0"

# Обе уже приходят транзитивно через gpui; здесь они нужны прямо — ради
# `mlock`/`VirtualLock` и запрета дампов в `src/platform.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ErrorReporting",
    "Win32_System_Diagnostics_Debug",
    # QueryUnbiasedInterruptTime — время без сна, для автолока.
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
] }

[profile.dev]
# Зависимости (gpui, blade, шейпинг) собираем с оптимизацией: дебажим свой код,
# а не чужой, а нам важна отзывчивость даже в дебажной сборке.
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
alacritty_terminal = "0.26.0"
gpui = { workspace = true, features = ["test-support"] }
rand = { version = "0.10.2", features = ["thread_rng"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net", "sync"] }
