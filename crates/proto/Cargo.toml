[package]
name = "proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Record types, serialization and versioning of the vault format"

# Like `vault`, knows nothing about UI, network or filesystem:
# only bytes and their meaning live here. Where those bytes land is up to the application layer
# (local directory) and `sync` (folder or server).
[dependencies]
vault = { path = "../vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
getrandom = { version = "0.4.3", default-features = false }
# Constant-time secret comparison and zeroing of the record
# plaintext after encryption.
subtle = "2.6.1"
zeroize = "1.9.0"
# Icon bytes in the record body (JSON) are base64, not an array of numbers.
base64 = "0.22"
