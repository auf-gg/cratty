[package]
name = "sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transfer of encrypted records between devices"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
proto = { path = "../proto" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
