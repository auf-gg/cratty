settings:
  language:
    title: "Interface language"
    system: "System (%{language})"
  opacity:
    title: "Terminal transparency"
    blur: "Background blur"
    blur_tooltip: "Blurs the image behind the terminal window for better readability."
    blur_unavailable: "Unavailable on Windows 10: blur slows down moving and resizing the window."
    note_solid: "100% is an opaque background. At lower values the desktop shows through the terminal."
    note_partial: "Transparency applies only to the terminal background."
  prediction:
    title: "Input prediction"
    adaptive: "Adaptive"
    adaptive_tooltip: "Only when echo latency is over 30 ms"
    always: "Always"
    always_tooltip: "On any connection"
    never: "Never"
    never_tooltip: "Characters appear after the server responds"
    note: "Typed characters appear immediately and are underlined until the server confirms them. Password input is not displayed: after Enter, characters appear only after the server responds."
    latency: "Echo latency in the current session: %{ms} ms."
    latency_unknown: "Echo latency has not been measured yet. It is measured from the first characters typed."
  font_size:
    title: "Terminal font size"
    value: "%{size} px"
    hint: "Applies to all open sessions"
  autolock:
    title: "Automatic lock"
    enable: "Lock vaults automatically"
    minutes_hint: "Minutes of inactivity before locking"
    minutes_value: "%{minutes} min"
    note_on: "The vault is also locked when the computer goes to sleep. Open sessions keep running."
    note_off: "Vaults stay open until you lock them yourself or close the app. Convenient if the password is remembered by the system: it will unlock the vault without prompting anyway."
  os_key:
    title: "Unlock without a password on this computer"
    enable: "Enable"
    disable: "Disable"
    note_on: "The vault unlocks without a password on this computer. The key is stored in the system credential store: Keychain (macOS), Credential Manager (Windows), Secret Service (Linux)."
    note_available: "The key will be saved in the system credential store. The master password and recovery phrase remain valid; you can turn this off at any time."
    note_locked: "Available only while the vault is unlocked."
    warning: "The key is protected by your operating system account: once you are signed in, it is available to programs running as you."
  vault_line: "Vault: %{name}"
  sync:
    title: "Folder sync"
    apply: "Apply"
    syncing: "Syncing…"
    now: "Sync now"
    now_tooltip: "Pull changes from the folder and write your own"
    now_unavailable: "Requires an unlocked vault and a folder path"
    note: "Entries are saved to the folder encrypted and can be shared via Dropbox, Syncthing or a network drive. An empty path disables sync."
    note_excluded: "Entries marked \"Don't sync\" are not saved to the folder."
  data:
    title: "Data location"
    vault: "Vault \"%{name}\": %{path}"
    settings: "Settings: %{path}"
    unknown: "Directory not determined"
