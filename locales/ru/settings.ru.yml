    hint: "Применяется ко всем открытым сеансам"
  autolock:
    title: "Автоматическая блокировка"
    enable: "Блокировать хранилища автоматически"
    minutes_hint: "Через сколько минут бездействия"
    minutes_value: "%{minutes} мин"
    note_on: "Хранилище также блокируется после перехода компьютера в спящий режим. Открытые сеансы при этом продолжают работать."
    note_off: "Хранилища остаются открытыми, пока вы не заблокируете их сами или не закроете приложение. Удобно, если пароль запомнен в системе: он всё равно разблокирует хранилище без вопросов."
  os_key:
    title: "Разблокировка без пароля на этом компьютере"
    enable: "Включить"
    disable: "Отключить"
    note_on: "Хранилище разблокируется без пароля на этом компьютере. Ключ хранится в системном хранилище учётных данных: Keychain (macOS), диспетчер учётных данных (Windows), Secret Service (Linux)."
    note_available: "Ключ будет сохранён в системном хранилище учётных данных. Мастер-пароль и фраза восстановления продолжат действовать; функцию можно отключить в любой момент."
    note_locked: "Доступно только при разблокированном хранилище."
    warning: "Ключ защищён учётной записью операционной системы: после входа в систему он доступен программам, запущенным от вашего имени."
  vault_line: "Хранилище: %{name}"
  sync:
    title: "Синхронизация через папку"
    apply: "Применить"
    syncing: "Синхронизация…"
    now: "Синхронизировать сейчас"
    now_tooltip: "Получить изменения из папки и записать свои"
    now_unavailable: "Требуются разблокированное хранилище и указанная папка"
    note: "Записи сохраняются в папку в зашифрованном виде и могут передаваться через Dropbox, Syncthing или сетевой диск. Пустой путь отключает синхронизацию."
    note_excluded: "Записи с отметкой «Не синхронизировать» в папку не сохраняются."
  data:
    title: "Расположение данных"
    vault: "Хранилище «%{name}»: %{path}"
    settings: "Настройки: %{path}"
    unknown: "Каталог не определён"
