settings:
  language:
    title: "Язык интерфейса"
    system: "Системный (%{language})"
  opacity:
    title: "Прозрачность терминала"
    blur: "Размытие фона"
    blur_tooltip: "Размывает изображение под окном терминала для лучшей читаемости."
    blur_unavailable: "Недоступно в Windows 10: размытие замедляет перемещение и изменение размера окна."
    note_solid: "100 % — непрозрачный фон. При меньшем значении сквозь терминал виден рабочий стол."
    note_partial: "Прозрачность применяется только к фону терминала."
  prediction:
    title: "Предсказание ввода"
