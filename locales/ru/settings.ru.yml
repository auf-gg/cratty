    always: "Всегда"
    always_tooltip: "На любом соединении"
    never: "Никогда"
    never_tooltip: "Символ отображается после ответа сервера"
    note: "Введённые символы отображаются сразу и подчёркиваются до подтверждения сервером. Ввод паролей не отображается: после Enter символы появляются только после ответа сервера."
    latency: "Задержка эха в текущем сеансе: %{ms} мс."
    latency_unknown: "Задержка эха ещё не измерена. Измерение выполняется по первым введённым символам."
